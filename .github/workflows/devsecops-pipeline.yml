name: Secure DevSecOps Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-execution-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Active Source Repository Baseline
        uses: actions/checkout@v4

      - name: Provision Enterprise Python Run Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Resolve Project Dependencies Securely
        run: |
          pip install -r app/src/requirements.txt

      - name: Execute Core Application via Managed Automated Injection
        env:
          DB_URL: ${{ secrets.PROD_DB_URL }}
          API_KEY: ${{ secrets.PROD_API_KEY }}
        run: |
          python app/src/main.py

      # ==============================================================================
      # FIXED ENTERPRISE AUTOMATION STEP: ADDING THE CORRECT WORKING DIRECTORY PATH
      # ==============================================================================
      - name: Execute System Hardening Blueprint via Ansible Playbook
        env:
          DB_PASSWORD: ${{ secrets.PROD_DB_URL }} 
        # Using working-directory forces GitHub to move into the ansible folder before executing
        defaults:
          run:
            working-directory: ./ansible
        run: |
          ansible-playbook -i inventory.ini site-hardening.yml


